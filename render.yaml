services:
  - type: web
    name: sirae-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,0.0.0.0,testserver"
      - key: FRONTEND_URL
        value: "https://tu-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://tu-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://tu-frontend.onrender.com,https://*.onrender.com"
